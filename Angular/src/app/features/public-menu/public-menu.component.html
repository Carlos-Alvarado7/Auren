<main class="menu-page" *ngIf="state$ | async as state">
  <section class="menu-shell">
    <span class="corner corner-top-left" aria-hidden="true"></span>
    <span class="corner corner-top-right" aria-hidden="true"></span>
    <span class="corner corner-bottom-left" aria-hidden="true"></span>
    <span class="corner corner-bottom-right" aria-hidden="true"></span>
    <span class="frame-diamond frame-diamond-top" aria-hidden="true"></span>
    <span class="frame-diamond frame-diamond-bottom" aria-hidden="true"></span>

    <header class="brand-header">
      <img
        class="brand-logo"
        src="/logo-auren.png"
        alt="Auren Gastronomy"
        decoding="async"
        fetchpriority="high"
      >
      <span class="brand-rule" aria-hidden="true"></span>
    </header>

    <div class="loading" *ngIf="state.loading">Cargando carta...</div>
    <div class="error" *ngIf="state.error">{{ state.error }}</div>

    <ng-container *ngIf="state.menu as menu">
      <nav class="category-nav" aria-label="Categorías de la carta">
        <button
          *ngFor="let category of menu.categories; trackBy: trackById"
          type="button"
          [class.active]="activeCategoryId === category.id"
          [attr.aria-pressed]="activeCategoryId === category.id"
          (click)="scrollToCategory(category.id)"
        >
          {{ category.title }}
        </button>
      </nav>

      <div class="menu-board">
        <section
          class="category-panel"
          *ngFor="let category of menu.categories; trackBy: trackById"
          [ngClass]="categoryPanelClass(category.title)"
          [id]="category.id"
        >
          <div class="category-heading">
            <span
              class="category-icon"
              [ngClass]="'category-icon--' + (category.icon || 'diamond')"
              aria-hidden="true"
            >
              <auren-category-icon-svg [icon]="category.icon || 'diamond'"></auren-category-icon-svg>
            </span>
            <h2>{{ category.title }}</h2>
          </div>

          <div class="category-products">
            <article class="menu-item" *ngFor="let product of category.products; trackBy: trackById" [class.unavailable]="!product.available">
              <div class="item-title-row">
                <span class="item-diamond" aria-hidden="true"></span>
                <h3>{{ product.name }}</h3>
                <strong *ngIf="shouldShowPrice(product.priceCop)">{{ product.priceCop | copCurrency }}</strong>
              </div>

              <p *ngIf="product.description">{{ product.description }}</p>
              <span class="availability" *ngIf="!product.available">No disponible por ahora</span>

              <ul class="variant-list" *ngIf="product.variants.length > 0">
                <li *ngFor="let variant of product.variants">
                  <span>{{ variant.name }}</span>
                  <strong *ngIf="shouldShowPrice(variant.priceCop)">{{ variant.priceCop | copCurrency }}</strong>
                </li>
              </ul>
            </article>
          </div>
        </section>
      </div>

      <footer class="menu-footer">
        <span>Áuren Gastronomy</span>
      </footer>
    </ng-container>
  </section>
</main>
